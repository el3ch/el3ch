<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Zion Terminal Sign-Off">
  <defs>
    <linearGradient id="footGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003B00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#003B00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="crt6" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="130" rx="10" fill="#020804"/>
  <rect x="28" y="14" width="1144" height="100" rx="8" fill="#041208" stroke="#00FF41" stroke-opacity="0.45" stroke-width="1.2"/>
  <line x1="28" y1="14" x2="1172" y2="14" stroke="url(#footGrad)" stroke-width="2"/>

  <text x="52" y="48" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#008F11">
    root@el3ch:~$ <tspan fill="#00FF41" font-weight="bold">echo "There is no spoon. Only clean architecture."</tspan>
  </text>

  <text x="52" y="84" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7CFFB2">
    // OPEN TO SOFTWARE ENGINEERING &amp; SYSTEMS INTERNSHIPS  ·  TUNIS, TUNISIA  ·  mohamedamine.eleuch@gmail.com
  </text>

  <rect x="1098" y="69" width="10" height="17" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="130" rx="10" fill="url(#crt6)"/>
</svg>
